<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EER: Pion Arc Exchange & Nucleon Role Reversal</title>
    <style>
        body {
            margin: 0;
            background-color: #05070b;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h2 { margin: 0 0 5px 0; color: #58a6ff; font-size: 20px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { margin: 0; font-size: 13px; color: #8b949e; }
        #status-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        .highlight { color: #d2a8ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <h2>Entanglement-Entropy Relativity (EER)</h2>
        <p>Orthogonal Pion Arc & Deterministic Nucleon Role Reversal</p>
    </div>

    <div id="status-panel">
        Boundary State: <span id="phaseStep" class="highlight">1. Strain Accumulation in Shared Boundary</span>
    </div>

    <!-- Include Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// 1. Grid Substrate
const gridSize = 20;
const gridDivisions = 20;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1f6feb, 0x161b22);
gridHelper.position.y = 0;
scene.add(gridHelper);

const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x0d1117, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const basePlane = new THREE.Mesh(planeGeometry, planeMaterial);
basePlane.rotation.x = Math.PI / 2;
scene.add(basePlane);

// 2. Unified Nucleon Lobes
const lobeGeo = new THREE.SphereGeometry(1.2, 32, 32);

// Left Lobe (Starts as Neutron - Blue)
const leftMat = new THREE.MeshStandardMaterial({ color: 0x79c0ff, emissive: 0x79c0ff, emissiveIntensity: 0.3, roughness: 0.3 });
const leftLobe = new THREE.Mesh(lobeGeo, leftMat);
leftLobe.position.set(-1.1, 0, 0);
scene.add(leftLobe);

// Right Lobe (Starts as Proton - Red)
const rightMat = new THREE.MeshStandardMaterial({ color: 0xff7b72, emissive: 0xff7b72, emissiveIntensity: 0.3, roughness: 0.3 });
const rightLobe = new THREE.Mesh(lobeGeo, rightMat);
rightLobe.position.set(1.1, 0, 0);
scene.add(rightLobe);

// Central Shared Boundary Manifold
const boundaryGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.8, 32);
const boundaryMat = new THREE.MeshStandardMaterial({ color: 0x1f6feb, emissive: 0x1f6feb, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
const sharedBoundary = new THREE.Mesh(boundaryGeo, boundaryMat);
sharedBoundary.rotation.z = Math.PI / 2;
sharedBoundary.position.set(0, 0, 0);
scene.add(sharedBoundary);

// 3. 2-Axis Pion Shear Defect (Arting Packet)
const pionGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4); 
const pionMat = new THREE.MeshStandardMaterial({ color: 0xd2a8ff, emissive: 0xd2a8ff, emissiveIntensity: 0.9, wireframe: true });
const pionDefect = new THREE.Mesh(pionGeo, pionMat);
scene.add(pionDefect);

// Simulation State Engine
let clock = 0;
const statusText = document.getElementById('phaseStep');

function animate() {
    requestAnimationFrame(animate);
    clock += 0.012;
    let cycle = clock % 8.0; // 8-second full loop including state swap and return arc

    boundaryMat.emissiveIntensity = 0.3 + 0.5 * Math.abs(Math.sin(clock * 2));

    if (cycle < 1.5) {
        // STEP 1: Strain Accumulation
        statusText.innerText = "1. Shared Boundary: Capacity Strain (σ) Approaching LeBlanc Bound";
        leftLobe.material.emissiveIntensity = 0.3 + (cycle / 1.5) * 0.6;
        pionDefect.visible = false;
    } 
    else if (cycle < 2.0) {
        // STEP 2: Instantiation above Neutron Lobe
        statusText.innerText = "2. Saturation: Pion Shear Defect Instantiates Above Neutron Lobe";
        leftLobe.material.emissiveIntensity = 1.0;
        pionDefect.visible = true;
        pionDefect.position.set(-1.1, 1.2, 0);
    } 
    else if (cycle < 4.0) {
        // STEP 3: Upward Arc Across the Shared Boundary to Proton Lobe
        statusText.innerText = "3. Orthogonal Arc: Defect Shears Across Upper Entangled Boundary";
        let progress = (cycle - 2.0) / 2.0;
        let x = THREE.MathUtils.lerp(-1.1, 1.1, progress);
        let y = 1.2 + Math.sin(progress * Math.PI) * 1.5; // Parabolic arc above the lobes
        
        pionDefect.position.set(x, y, 0);
        pionDefect.rotation.x += 0.1;
        pionDefect.rotation.y += 0.1;
        leftLobe.material.emissiveIntensity = 0.3;
    } 
    else if (cycle < 4.5) {
        // STEP 4: Absorption & Topological Role Reversal
        statusText.innerText = "4. Absorption & Re-indexing: Nucleon Identities Flip (n ⟷ p)";
        pionDefect.position.set(1.1, 1.2, 0);
        rightLobe.material.emissiveIntensity = 1.0;

        // Perform color/role swap
        leftLobe.material.color.setHex(0xff7b72); // Neutron becomes Proton
        leftLobe.material.emissive.setHex(0xff7b72);
        rightLobe.material.color.setHex(0x79c0ff); // Proton becomes Neutron
        rightLobe.material.emissive.setHex(0x79c0ff);
    } 
    else if (cycle < 7.5) {
        // STEP 5: Settled in Swapped State
        statusText.innerText = "5. Entangled Boundary Relaxed in Swapped Configuration";
        pionDefect.visible = false;
        rightLobe.material.emissiveIntensity = 0.3;
    } 
    else {
        // Reset colors for continuous looping visualization
        leftLobe.material.color.setHex(0x79c0ff);
        leftLobe.material.emissive.setHex(0x79c0ff);
        rightLobe.material.color.setHex(0xff7b72);
        rightLobe.material.emissive.setHex(0xff7b72);
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
