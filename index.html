<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EER: Unified Nucleon Lobes & Shared Boundary Defect</title>
    <style>
        body {
            margin: 0;
            background-color: #05070b;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h2 { margin: 0 0 5px 0; color: #58a6ff; font-size: 20px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { margin: 0; font-size: 13px; color: #8b949e; }
        #status-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        .highlight { color: #d2a8ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <h2>Entanglement-Entropy Relativity (EER)</h2>
        <p>Unified Nucleon Lobes & Shared Entangled Boundary Matrix</p>
    </div>

    <div id="status-panel">
        Boundary State: <span id="phaseStep" class="highlight">1. Shared Boundary Strain Accumulation (σ approaching σ_LB)</span>
    </div>

    <!-- Include Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// 1. Grid Substrate
const gridSize = 20;
const gridDivisions = 20;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1f6feb, 0x161b22);
gridHelper.position.y = 0;
scene.add(gridHelper);

const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x0d1117, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const basePlane = new THREE.Mesh(planeGeometry, planeMaterial);
basePlane.rotation.x = Math.PI / 2;
scene.add(basePlane);

// 2. Unified Nucleon Lobes (Overlapping geometry with a central shared boundary)
const lobeGeo = new THREE.SphereGeometry(1.2, 32, 32);

// Neutron Lobe (Left)
const neutronMat = new THREE.MeshStandardMaterial({ color: 0x79c0ff, emissive: 0x79c0ff, emissiveIntensity: 0.3, roughness: 0.3 });
const neutronLobe = new THREE.Mesh(lobeGeo, neutronMat);
neutronLobe.position.set(-1.1, 0, 0);
scene.add(neutronLobe);

// Proton Lobe (Right)
const protonMat = new THREE.MeshStandardMaterial({ color: 0xff7b72, emissive: 0xff7b72, emissiveIntensity: 0.3, roughness: 0.3 });
const protonLobe = new THREE.Mesh(lobeGeo, protonMat);
protonLobe.position.set(1.1, 0, 0);
scene.add(protonLobe);

// Central Shared Boundary Manifold (The intersection area where lobes merge)
const boundaryGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.8, 32);
const boundaryMat = new THREE.MeshStandardMaterial({ color: 0x1f6feb, emissive: 0x1f6feb, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
const sharedBoundary = new THREE.Mesh(boundaryGeo, boundaryMat);
sharedBoundary.rotation.z = Math.PI / 2;
sharedBoundary.position.set(0, 0, 0);
scene.add(sharedBoundary);

// 3. 2-Axis Pion Shear Defect (Emerging directly from the shared boundary)
const pionGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5); 
const pionMat = new THREE.MeshStandardMaterial({ color: 0xd2a8ff, emissive: 0xd2a8ff, emissiveIntensity: 0.9, wireframe: true });
const pionShearDefect = new THREE.Mesh(pionGeo, pionMat);
scene.add(pionShearDefect);

// Simulation State Engine
let clock = 0;
const statusText = document.getElementById('phaseStep');

function animate() {
    requestAnimationFrame(animate);
    clock += 0.012;
    let cycle = clock % 6.0;

    // Pulse shared boundary intensity to show entropic pressure
    boundaryMat.emissiveIntensity = 0.3 + 0.5 * Math.abs(Math.sin(clock * 2));

    if (cycle < 1.5) {
        // STEP 1: Strain Accumulation in the Shared Boundary
        statusText.innerText = "1. Shared Boundary Zone: Capacity Strain (σ) approaching LeBlanc Bound (σ_LB)";
        neutronLobe.material.emissiveIntensity = 0.3 + (cycle / 1.5) * 0.6;
        pionShearDefect.visible = false;
    } 
    else if (cycle < 2.0) {
        // STEP 2: Saturation Trigger -> 2-Axis Shear Defect Emerges from Boundary
        statusText.innerText = "2. Boundary Saturation: 2-Axis Pion Shear Defect Ejects from Shared Interface";
        neutronLobe.material.emissiveIntensity = 0.9;
        pionShearDefect.visible = true;
        pionShearDefect.position.set(0, 0, 0);
        pionShearDefect.rotation.set(0, 0, 0);
    } 
    else if (cycle < 4.0) {
        // STEP 3: Boundary-Restructuring Shift (Defect shears across the internal topology)
        statusText.innerText = "3. Topological Shear: Phase Defect Re-indexing across the Entangled Interface";
        let progress = (cycle - 2.0) / 2.0;
        let x = THREE.MathUtils.lerp(0, 1.1, progress); // Shifts toward proton lobe region
        let y = Math.sin(progress * Math.PI) * 0.8; // Minor orthogonal relief swell
        
        pionShearDefect.position.set(x, y, 0);
        pionShearDefect.rotation.x += 0.1;
        pionShearDefect.rotation.y += 0.1;
        neutronLobe.material.emissiveIntensity = 0.3;
    } 
    else if (cycle < 4.5) {
        // STEP 4: Proton Lobe Absorption & State Shift
        statusText.innerText = "4. Proton Lobe Absorption: Internal Phase State Re-indexed";
        pionShearDefect.position.set(1.1, 0, 0);
        protonLobe.material.emissiveIntensity = 1.0;
    } 
    else {
        // STEP 5: Relaxation of Shared Boundary Matrix
        statusText.innerText = "5. Entangled Boundary Matrix Restabilized";
        pionShearDefect.visible = false;
        protonLobe.material.emissiveIntensity = 0.3;
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
