<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EER: Sequential Pion Exchange & Role Reversal</title>
    <style>
        body {
            margin: 0;
            background-color: #05070b;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h2 { margin: 0 0 5px 0; color: #58a6ff; font-size: 20px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { margin: 0; font-size: 13px; color: #8b949e; }
        #status-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        .highlight { color: #d2a8ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <h2>Entanglement-Entropy Relativity (EER)</h2>
        <p>Sequential Pion Instantiation, Travel, Absorption & Role Reversal</p>
    </div>

    <div id="status-panel">
        Phase State: <span id="phaseStep" class="highlight">1. Initial State</span>
    </div>

    <!-- Include Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// Grid Substrate
const gridSize = 20;
const gridDivisions = 20;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1f6feb, 0x161b22);
gridHelper.position.y = 0;
scene.add(gridHelper);

const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x0d1117, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const basePlane = new THREE.Mesh(planeGeometry, planeMaterial);
basePlane.rotation.x = Math.PI / 2;
scene.add(basePlane);

// Nucleon Lobes
const lobeGeo = new THREE.SphereGeometry(1.2, 32, 32);

// Left Lobe (Neutron - Blue)
const leftMat = new THREE.MeshStandardMaterial({ color: 0x79c0ff, emissive: 0x79c0ff, emissiveIntensity: 0.3, roughness: 0.3 });
const neutronLobe = new THREE.Mesh(lobeGeo, leftMat);
neutronLobe.position.set(-1.1, 0, 0);
scene.add(neutronLobe);

// Right Lobe (Proton - Red)
const rightMat = new THREE.MeshStandardMaterial({ color: 0xff7b72, emissive: 0xff7b72, emissiveIntensity: 0.3, roughness: 0.3 });
const protonLobe = new THREE.Mesh(lobeGeo, rightMat);
protonLobe.position.set(1.1, 0, 0);
scene.add(protonLobe);

// Shared Boundary Manifold
const boundaryGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.8, 32);
const boundaryMat = new THREE.MeshStandardMaterial({ color: 0x1f6feb, emissive: 0x1f6feb, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
const sharedBoundary = new THREE.Mesh(boundaryGeo, boundaryMat);
sharedBoundary.rotation.z = Math.PI / 2;
sharedBoundary.position.set(0, 0, 0);
scene.add(sharedBoundary);

// Pion Shear Defect
const pionGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4); 
const pionMat = new THREE.MeshStandardMaterial({ color: 0xd2a8ff, emissive: 0xd2a8ff, emissiveIntensity: 0.9, wireframe: true });
const pion = new THREE.Mesh(pionGeo, pionMat);
scene.add(pion);

// Simulation State Engine
let clock = 0;
const statusText = document.getElementById('phaseStep');

function animate() {
    requestAnimationFrame(animate);
    clock += 0.012;
    let cycle = clock % 8.0; // 8-second total loop

    // Keep track of current color assignments based on cycle state
    let isSwapped = cycle >= 4.5 && cycle < 7.5;
    
    if (!isSwapped) {
        neutronLobe.material.color.setHex(0x79c0ff);
        neutronLobe.material.emissive.setHex(0x79c0ff);
        protonLobe.material.color.setHex(0xff7b72);
        protonLobe.material.emissive.setHex(0xff7b72);
    } else {
        neutronLobe.material.color.setHex(0xff7b72);
        neutronLobe.material.emissive.setHex(0xff7b72);
        protonLobe.material.color.setHex(0x79c0ff);
        protonLobe.material.emissive.setHex(0x79c0ff);
    }

    if (cycle < 1.5) {
        // STEP 1: Strain accumulation
        statusText.innerText = "1. Strain building toward LeBlanc Bound saturation";
        pion.visible = false;
    } 
    else if (cycle < 2.0) {
        // STEP 2: Pion instantiates above the neutron
        statusText.innerText = "2. Pion instantiates above the neutron";
        pion.visible = true;
        pion.position.set(-1.1, 1.5, 0); // Positioned directly above neutron
    } 
    else if (cycle < 4.0) {
        // STEP 3: Pion travels to the proton
        statusText.innerText = "3. Pion travels across the arc toward the proton";
        let progress = (cycle - 2.0) / 2.0;
        let x = THREE.MathUtils.lerp(-1.1, 1.1, progress);
        let y = 1.5 + Math.sin(progress * Math.PI) * 0.8;
        pion.position.set(x, y, 0);
        pion.rotation.x += 0.1;
    } 
    else if (cycle < 4.5) {
        // STEP 4: Pion is absorbed by the proton, colors switch
        statusText.innerText = "4. Pion is absorbed by the proton — colors switch";
        pion.position.set(1.1, 1.5, 0);
        
        // Force swap state immediately upon absorption
        neutronLobe.material.color.setHex(0xff7b72);
        neutronLobe.material.emissive.setHex(0xff7b72);
        protonLobe.material.color.setHex(0x79c0ff);
        protonLobe.material.emissive.setHex(0x79c0ff);
    } 
    else if (cycle < 7.5) {
        // STEP 5: Settled in swapped state
        statusText.innerText = "5. Roles reversed (Neutron ⟷ Proton)";
        pion.visible = false;
    } 
    else {
        // Reset for next loop iteration
        statusText.innerText = "Resetting boundary state...";
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
