<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EER: Deterministic Pion Exchange & Topological Phase</title>
    <style>
        body {
            margin: 0;
            background-color: #05070b;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h2 { margin: 0 0 5px 0; color: #58a6ff; font-size: 20px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { margin: 0; font-size: 13px; color: #8b949e; }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 12px;
            color: #6e7681;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2>Entanglement-Entropy Relativity (EER)</h2>
        <p>Deterministic Pion ($\pi^0$) Exchange: Topological Phase Shift on Planar Action Space</p>
    </div>
    
    <div class="controls-hint">Use mouse to rotate, pan, and zoom around the pseudomanifold grid.</div>

    <!-- Include Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 14, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// 1. Create the 2D Causal Pseudomanifold (Planar Action Space Grid)
const gridSize = 20;
const gridDivisions = 20;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1f6feb, 0x161b22);
gridHelper.position.y = 0;
scene.add(gridHelper);

const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
const planeMaterial = new THREE.MeshBasicMaterial({
    color: 0x0d1117,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
});
const basePlane = new THREE.Mesh(planeGeometry, planeMaterial);
basePlane.rotation.x = Math.PI / 2;
scene.add(basePlane);

// 2. Create Nucleons (Proton & Neutron)
// Proton (Red - positive/charged capacity state)
const protonGeo = new THREE.SphereGeometry(0.7, 32, 32);
const protonMat = new THREE.MeshStandardMaterial({ color: 0xff7b72, emissive: 0xff7b72, emissiveIntensity: 0.5 });
const proton = new THREE.Mesh(protonGeo, protonMat);
proton.position.set(-5, 0, 0);
scene.add(proton);

// Neutron (Blue/Cyan - neutral capacity state)
const neutronGeo = new THREE.SphereGeometry(0.7, 32, 32);
const neutronMat = new THREE.MeshStandardMaterial({ color: 0x79c0ff, emissive: 0x79c0ff, emissiveIntensity: 0.5 });
const neutron = new THREE.Mesh(neutronGeo, neutronMat);
neutron.position.set(5, 0, 0);
scene.add(neutron);

// 3. Create the Topological Pion Packet ($\pi^0$)
const pionGeo = new THREE.SphereGeometry(0.35, 24, 24);
const pionMat = new THREE.MeshStandardMaterial({ color: 0xd2a8ff, emissive: 0xd2a8ff, emissiveIntensity: 0.9 });
const pionPacket = new THREE.Mesh(pionGeo, pionMat);
scene.add(pionPacket);

// Simulation State Variables for Back-and-Forth Phase Exchange
let exchangeProgress = 0;
let exchangeDirection = 1; // 1: Proton -> Neutron, -1: Neutron -> Proton
const exchangeSpeed = 0.015;

// Animation Loop (Deterministic Phase Transfer & Orthogonal Venting)
function animate() {
    requestAnimationFrame(animate);

    // Update exchange progress across the pseudomanifold link
    exchangeProgress += exchangeSpeed * exchangeDirection;

    // Reverse direction at endpoints (representing continuous reciprocal $\pi^0$ exchange)
    if (exchangeProgress >= 1.0) {
        exchangeProgress = 1.0;
        exchangeDirection = -1;
    } else if (exchangeProgress <= 0.0) {
        exchangeProgress = 0.0;
        exchangeDirection = 1;
    }

    // Interpolate position along the discrete lattice link between proton and neutron
    let currentX = THREE.MathUtils.lerp(-5, 5, exchangeProgress);
    // Add a parabolic height arc in the 3D bulk projection to represent orthogonal action relief ($\Upsilon$)
    let currentY = Math.sin(exchangeProgress * Math.PI) * 2.5; 

    pionPacket.position.set(currentX, currentY, 0);

    // Pulse emission intensity to mimic LeBlanc Bound ($\sigma_{LB}$) saturation triggering
    pionMat.emissiveIntensity = 0.5 + 0.5 * Math.sin(exchangeProgress * Math.PI * 4);

    controls.update();
    renderer.render(scene, camera);
}

animate();

// Responsive resizing
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
