<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EER: Stepped Deterministic Pion Exchange</title>
    <style>
        body {
            margin: 0;
            background-color: #05070b;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h2 { margin: 0 0 5px 0; color: #58a6ff; font-size: 20px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { margin: 0; font-size: 13px; color: #8b949e; }
        #status-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        .highlight { color: #d2a8ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <h2>Entanglement-Entropy Relativity (EER)</h2>
        <p>Stepped Topological Phase Exchange ($\pi^0$ Nucleon-Nucleon Interaction)</p>
    </div>

    <div id="status-panel">
        Phase State: <span id="phaseStep" class="highlight">1. Accumulating Capacity Strain ($\Upsilon$)</span>
    </div>

    <!-- Include Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 14, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// 1. Grid Substrate
const gridSize = 20;
const gridDivisions = 20;
const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1f6feb, 0x161b22);
gridHelper.position.y = 0;
scene.add(gridHelper);

const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x0d1117, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const basePlane = new THREE.Mesh(planeGeometry, planeMaterial);
basePlane.rotation.x = Math.PI / 2;
scene.add(basePlane);

// 2. Nucleons (Proton & Neutron)
const protonGeo = new THREE.SphereGeometry(0.7, 32, 32);
const protonMat = new THREE.MeshStandardMaterial({ color: 0xff7b72, emissive: 0xff7b72, emissiveIntensity: 0.3 });
const proton = new THREE.Mesh(protonGeo, protonMat);
proton.position.set(-5, 0, 0);
scene.add(proton);

const neutronGeo = new THREE.SphereGeometry(0.7, 32, 32);
const neutronMat = new THREE.MeshStandardMaterial({ color: 0x79c0ff, emissive: 0x79c0ff, emissiveIntensity: 0.3 });
const neutron = new THREE.Mesh(neutronGeo, neutronMat);
neutron.position.set(5, 0, 0);
scene.add(neutron);

// 3. Topological Pion Packet ($\pi^0$)
const pionGeo = new THREE.SphereGeometry(0.35, 24, 24);
const pionMat = new THREE.MeshStandardMaterial({ color: 0xd2a8ff, emissive: 0xd2a8ff, emissiveIntensity: 0.9, transparent: true, opacity: 0.0 });
const pionPacket = new THREE.Mesh(pionGeo, pionMat);
pionPacket.position.set(-5, 0, 0);
scene.add(pionPacket);

// Stepped Simulation State Engine
let clock = 0;
const statusText = document.getElementById('phaseStep');

function animate() {
    requestAnimationFrame(animate);
    clock += 0.012;
    let cycle = clock % 6.0; // 6-second total exchange loop

    if (cycle < 1.5) {
        // STEP 1: Capacity Accumulation
        statusText.innerText = "1. Accumulating Capacity Strain (σ approaching σ_LB)";
        protonMat.emissiveIntensity = 0.3 + (cycle / 1.5) * 0.7; // Pulsing glow
        pionMat.opacity = 0.0;
        pionPacket.position.set(-5, 0, 0);
    } 
    else if (cycle < 2.0) {
        // STEP 2: LeBlanc Bound Saturation & Instantiation
        statusText.innerText = "2. Saturation Reached: Instantiating Discrete Pion Packet (π⁰)";
        protonMat.emissiveIntensity = 1.0;
        pionMat.opacity = 1.0;
        pionPacket.position.set(-5, 0.5, 0);
    } 
    else if (cycle < 4.0) {
        // STEP 3: Bounded Step Transit across Pseudomanifold Link
        statusText.innerText = "3. Deterministic Phase Transfer across Pseudomanifold Link (Bounded by c)";
        let progress = (cycle - 2.0) / 2.0;
        let x = THREE.MathUtils.lerp(-5, 5, progress);
        let y = Math.sin(progress * Math.PI) * 2.5; // Orthogonal action relief arc
        pionPacket.position.set(x, y, 0);
        protonMat.emissiveIntensity = 0.3;
    } 
    else if (cycle < 4.5) {
        // STEP 4: Target Re-indexing & Absorption
        statusText.innerText = "4. Target Node Reception: Re-indexing Internal Topological State";
        pionPacket.position.set(5, 0.5, 0);
        neutronMat.emissiveIntensity = 1.0;
    } 
    else {
        // STEP 5: Reset / Settle
        statusText.innerText = "5. Lattice Relaxation & State Resolved";
        pionMat.opacity = 0.0;
        neutronMat.emissiveIntensity = 0.3;
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
